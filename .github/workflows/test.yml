name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe des modules du navigateur
        run: for f in $(find public/js -name '*.js'); do node --input-type=module --check < "$f" || exit 1; done
      - name: Tests de l'API
        run: npm test
