<script>
  // Appliqué avant le premier rendu, pour éviter un flash de thème
  try {
    const t = localStorage.getItem('lanchat:theme'), s = localStorage.getItem('lanchat:side'), d = localStorage.getItem('lanchat:density');

    document.documentElement.dataset.side = s || 'foret';
    if (d) document.documentElement.dataset.density = d;
  } catch {}
</script>

<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Navigation">

        <span class="ws-name" id="wsName">LAN Chat</span><svg class="ic sm" aria-hidden="true"><use href="#i-chev-down"/></svg>
      </button>
      <button class="side-ic" id="newMsgBtn" type="button" aria-label="Nouveau message" title="Nouveau message"><svg class="ic" aria-hidden="true"><use href="#i-compose"/></svg></button>
    </header>
    <button class="jump" id="jumpBtn" type="button"><svg class="ic sm" aria-hidden="true"><use href="#i-search"/></svg><span>Aller à…</span><kbd id="jumpKbd">⌘K</kbd></button>

    <button class="me-btn" id="meBtn" type="button" aria-haspopup="menu"></button>
  </aside>

  <main class="main" id="main">
    <div class="offline" id="offline" hidden role="status">Connexion perdue. Reconnexion…</div>
    <header class="top" id="top"></header>
    <div class="banners" id="banners"></div>
    <div class="msgs" id="msgs" tabindex="-1"></div>
    <button class="newpill" id="newPill" type="button" hidden></button>
    <div class="composer-host" id="mainComposer"></div>
    <div class="drop" aria-hidden="true"><div><svg class="ic" aria-hidden="true"><use href="#i-upload"/></svg><span>Déposer pour envoyer</span></div></div>
  </main>

  <aside class="pane" id="pane" aria-label="Panneau latéral"></aside>
</div>
